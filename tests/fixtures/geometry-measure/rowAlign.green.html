<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry-measure fixture: rowAlign (green)</title>
<!-- Clean case for the rowAlign measurement; no check may fail. -->
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 14px/20px Arial, Helvetica, sans-serif; }
  [data-measure-root] { width: 640px; padding: 16px; }
  .part { margin: 0 0 24px; }
  .tcrn-table { border-collapse: collapse; width: 400px; }
  .tcrn-table th, .tcrn-table td { padding: 4px 8px; text-align: left; }
  .rows { list-style: none; margin: 16px 0 0; padding: 0; width: 320px; }
  .rows > li { padding: 4px 8px; }
</style>
</head>
<body>
<main data-measure-root>
<table class="tcrn-table">
  <thead><tr><th>Name</th><th>Role</th></tr></thead>
  <tbody>
    <tr><td>Ada Lovelace</td><td>Owner</td></tr>
    <tr aria-selected="true"><td>Grace Hopper</td><td>Editor</td></tr>
    <tr><td>Alan Turing</td><td>Viewer</td></tr>
  </tbody>
</table>
<ul class="rows" data-rows>
  <li>First row</li>
  <li>Second row</li>
</ul>
</main>
</body>
</html>
