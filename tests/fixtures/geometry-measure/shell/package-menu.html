<style>
  body { margin: 0; background: #efeeea; color: #16150f; font: 500 12.5px/1.2 sans-serif; }
  * { box-sizing: border-box; }
  /* the shell, with the C-5 hooks the readings need */
  [data-shell] { position: relative; width: 1240px; height: 520px; display: grid; grid-template-rows: 52px 1fr; }
  [data-shell-strip] { display: flex; align-items: center; padding: 0 12px; }
  [data-tab] { display: inline-flex; align-items: center; gap: 10px; width: 134px; height: 40px; padding: 0 9px; border: 0; background: transparent; }
  [data-tab] b { font-weight: 600; white-space: nowrap; }
  [data-cluster] { display: flex; align-items: center; height: 40px; margin-left: auto; }
  [data-cluster] button { width: 32px; height: 32px; border: 0; background: transparent; }
  [data-paper] { margin: 0 12px 12px; border-radius: 14px; background: #fff; }
  /* the full menu (07b): left 12, top 52 + 6, panel padding 8, three columns 16 apart */
  [data-panel="expanded"] { position: absolute; top: 58px; left: 12px; width: 952px; padding: 8px; border-radius: 12px; background: #fff; }
  [data-shell-cols] { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 16px; }
  [data-shell-col] { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  /* the package's pinnable row (base.css.ts): a link and its pin side by side; the pin keeps its 24 track
     and shows with opacity, so a rest row's text box is as wide as a hover or selected one */
  .tcrn-nav-item-row { display: grid; grid-template-columns: minmax(0, 1fr) 24px; column-gap: 10px; align-items: center; height: 32px; padding-inline-end: 4px; border-radius: 8px; }
  .tcrn-nav-item-row > [data-shell-row] { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; align-items: center; height: 100%; min-width: 0; padding-left: 8px; color: #4f4c43; text-decoration: none; }
  .tcrn-nav-item-row > [aria-current="page"] { color: #16150f; font-weight: 600; }
  [data-guide="prail"] { display: block; width: 22px; height: 22px; padding: 3px; }
  [data-text="prail"] { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-pin-button] { display: inline-flex; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; opacity: 0; }
  .tcrn-nav-item-row:has(> [data-tcrn-preview-state~="hover"]) > [data-pin-button],
  .tcrn-nav-item-row:has(> [aria-current="page"]) > [data-pin-button] { opacity: 1; }
  /* the group heading (NavGroup): its text truncates under its title, a pinnable group keeps its pin
     beside it (TCRN-DS-SUB-206) */
  .tcrn-nav-group__label { display: flex; align-items: center; gap: 10px; min-height: 32px; min-width: 0; padding: 0 4px 0 8px; white-space: nowrap; }
  .tcrn-nav-group__label-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the package's full menu hides its pinned column at >= 1024 (shell.css.ts: the pinned items are in the
     strip there); the column, its rows and its four pins are in the DOM and draw nothing */
  @media (min-width: 1024px) {
    .tcrn-shell-menu .tcrn-shell-menu__col--pinned { display: none; }
  }
  /* the package's search field (inputs.css.ts): the shortcut is a sibling laid over the input (absolute,
     no pointer events, no fill of its own), so its text stands on the input's 6% wash, not on the panel
     (TCRN-DS-SUB-207); light in the full menu, night on a night panel below */
  .tcrn-search-input { position: relative; display: block; margin: 0 0 8px; }
  .tcrn-search-input__control { display: block; width: 100%; height: 28px; margin: 0; padding: 0 64px 0 10px; border: 0; border-radius: 8px; background: rgba(22, 21, 15, 0.06); color: #16150f; font: inherit; }
  .tcrn-search-input__shortcut { position: absolute; top: 50%; right: 8px; display: inline-flex; align-items: center; padding: 0 4px; border: 1px solid #d6d3ca; border-radius: 4px; color: #4f4c43; font: 500 10px/14px monospace; transform: translateY(-50%); pointer-events: none; }
  .night-panel { width: 280px; padding: 12px; border-radius: 12px; background: #191916; }
  .night-panel .tcrn-search-input { margin: 0; }
  .night-panel .tcrn-search-input__control { background: rgba(235, 232, 223, 0.07); color: #ebe8df; }
  .night-panel .tcrn-search-input__shortcut { border-color: #3a3933; color: #a9a69c; }
  /* the 07a B reading cases */
  .cases { display: flex; gap: 24px; align-items: flex-start; padding: 24px 12px; }
  .canvas { padding: 12px; background: #efeeea; }
  .surface { width: 160px; height: 48px; background: #ffffff; }
  .phone { position: relative; width: 390px; height: 160px; }
  .phone .paper { height: 100%; padding: 16px; background: #ffffff; color: #4f4c43; }
  .phone [data-shell-scrim] { position: absolute; inset: 0; z-index: 1; background: rgba(22, 21, 15, 0.2); }
  .phone .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 60px; padding: 16px; background: #ffffff; color: #4f4c43; }
  .ink-2 { color: #4f4c43; }
</style>
