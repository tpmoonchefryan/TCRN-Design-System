<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry-measure fixture: rail (green)</title>
<!-- Clean case for the rail measurement; no check may fail. -->
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 14px/20px Arial, Helvetica, sans-serif; }
  [data-measure-root] { width: 640px; padding: 16px; }
  .part { margin: 0 0 24px; }
  .scr { position: relative; width: 480px; height: 120px; background: #fafafa; }
  .rail { width: 200px; padding-top: 8px; }
  .rail-item { display: flex; align-items: center; height: 32px; padding-left: 16px; color: #111111; text-decoration: none; }
  .ico { display: block; width: 20px; height: 20px; background: #666666; }
  .rail-label { margin-left: 12px; }
</style>
</head>
<body>
<main data-measure-root>
<div class="scr" data-shell="fixture">
  <nav class="rail">
    <a class="rail-item" href="#home"><span class="ico" data-guide="rail"></span><span class="rail-label" data-text="rail">Home</span></a>
    <a class="rail-item" href="#projects"><span class="ico" data-guide="rail"></span><span class="rail-label" data-text="rail">Projects</span></a>
  </nav>
</div>
</main>
</body>
</html>
