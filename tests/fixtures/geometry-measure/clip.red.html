<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry-measure fixture: clip (red)</title>
<!-- Violation for the clip measurement only: A child is 280px wide inside a 240px frame with overflow: hidden. -->
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 14px/20px Arial, Helvetica, sans-serif; }
  [data-measure-root] { width: 640px; padding: 16px; }
  .part { margin: 0 0 24px; }
  .frame { width: 240px; height: 64px; overflow: hidden; border: 1px solid #888888; }
  .inner { width: 280px; height: 40px; margin: 8px; background: #eeeeee; }
</style>
</head>
<body>
<main data-measure-root>
<div class="frame"><div class="inner">This box is wider than its frame</div></div>
</main>
</body>
</html>
