<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry-measure fixture: shellFrame (red)</title>
<!-- Violations for the shellFrame measurement only, one shell root each: the paper flush with the shell's start, end and bottom edges (inset 0, deviation 12), a 1px rule under the top band (148-GWT3; the band stays 52 tall), a filled top band, the band at the old top bar's 68 (deviation 16), a square paper (radius 0, deviation 14), a shell with no paper and a shell with no top band. Rail is skipped here; the shells have no side rail. -->
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 14px/20px Arial, Helvetica, sans-serif; }
  [data-measure-root] { width: 640px; padding: 16px; }
  .part { margin: 0 0 24px; }
  .band-shell { position: relative; width: 560px; height: 160px; background: #efeeea; }
  .band { position: absolute; top: 0; right: 0; left: 0; box-sizing: border-box; height: 52px; margin: 0; padding: 0 12px; border: 0; background: none; }
  .band--rule { border-bottom: 1px solid #dddddd; }
  .band--filled { background: #ffffff; }
  .band--tall { height: 68px; }
  .paper { position: absolute; top: 52px; right: 12px; bottom: 12px; left: 12px; border-radius: 14px; background: #ffffff; }
  .paper--flush { right: 0; bottom: 0; left: 0; }
  .paper--square { border-radius: 0; }
</style>
</head>
<body>
<main data-measure-root>
<section class="part">
<div class="band-shell" data-shell="flush" data-state="closed" data-measure-skip="rail">
  <header class="band" data-shell-strip></header>
  <div class="paper paper--flush" data-paper></div>
</div>
</section>
<section class="part">
<div class="band-shell" data-shell="band-rule" data-state="closed" data-measure-skip="rail">
  <header class="band band--rule" data-shell-strip></header>
  <div class="paper" data-paper></div>
</div>
</section>
<section class="part">
<div class="band-shell" data-shell="band-filled" data-state="closed" data-measure-skip="rail">
  <header class="band band--filled" data-shell-strip></header>
  <div class="paper" data-paper></div>
</div>
</section>
<section class="part">
<div class="band-shell" data-shell="tall-band" data-state="closed" data-measure-skip="rail">
  <header class="band band--tall" data-shell-strip></header>
  <div class="paper" data-paper></div>
</div>
</section>
<section class="part">
<div class="band-shell" data-shell="square-paper" data-state="closed" data-measure-skip="rail">
  <header class="band" data-shell-strip></header>
  <div class="paper paper--square" data-paper></div>
</div>
</section>
<section class="part">
<div class="band-shell" data-shell="no-paper" data-state="closed" data-measure-skip="rail">
  <header class="band" data-shell-strip></header>
</div>
</section>
<section class="part">
<div class="band-shell" data-shell="no-band" data-state="closed" data-measure-skip="rail">
  <div class="paper" data-paper></div>
</div>
</section>
</main>
</body>
</html>
