<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry-measure fixture: contrast (red)</title>
<!-- Violation for the contrast measurement only: The cell expects 18.88 (#111111 on white) but renders #6b6b6b. -->
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 14px/20px Arial, Helvetica, sans-serif; }
  [data-measure-root] { width: 640px; padding: 16px; }
  .part { margin: 0 0 24px; }
  .cells { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
</style>
</head>
<body>
<main data-measure-root>
<div class="cells">
  <span data-cell="ink" data-expect="18.88" style="color: #6b6b6b">Body ink</span>
</div>
</main>
</body>
</html>
