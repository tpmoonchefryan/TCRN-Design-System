<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geometry-measure fixture: controlHeight (height not allowed)</title>
<!-- Violation: The bar declares and renders 36px, which is not one of 28/32/40. -->
<style>
  body { margin: 0; background: #ffffff; color: #111111; font: 14px/20px Arial, Helvetica, sans-serif; }
  [data-measure-root] { width: 640px; padding: 16px; }
  .part { margin: 0 0 24px; }
  .ctl-row { display: flex; gap: 8px; align-items: center; }
  .ctl-btn { box-sizing: border-box; height: 32px; padding: 0 12px; font: inherit; }
  .ctl-field { box-sizing: border-box; height: 28px; width: 160px; font: inherit; }
  .ctl-bar { box-sizing: border-box; height: 40px; width: 120px; background: #eeeeee; }
</style>
</head>
<body>
<main data-measure-root>
<div class="ctl-row">
  <div class="ctl-bar" data-h="36" style="height: 36px"></div>
</div>
</main>
</body>
</html>
